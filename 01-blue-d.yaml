apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  #labels related to deployment resources
  labels:
    version: blue
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      version: blue
      app: nginx
  #pod definition
  template:
    metadata:
      labels:
        version: blue
        app: nginx
    spec:
      containers:
        - name: nginx
          image: amarenugu/blue-green:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80