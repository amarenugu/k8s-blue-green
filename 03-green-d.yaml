apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-green
  #labels related to deployment resources
  labels:
    version: green
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      version: green
      app: nginx
  #pod definition
  template:
    metadata:
      labels:
        version: green
        app: nginx
    spec:
      containers:
        - name: nginx
          image: amarenugu/blue-green:0.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80